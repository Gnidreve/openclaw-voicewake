name: Build macOS Binary

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Package as ZIP
        run: |
          set -euo pipefail
          stage="claw-voice-bridge-macos"
          mkdir "$stage"
          cp target/release/claw-voice-bridge "$stage/"
          cp README.md config.example.toml "$stage/"
          ditto -c -k --sequesterRsrc --keepParent "$stage" claw-voice-bridge-macos.zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: claw-voice-bridge-macos
          path: claw-voice-bridge-macos.zip
          retention-days: 14

      - name: Create GitHub Release
        # Tag gepusht (z. B. per `git push origin <tag>`), aber noch keine
        # Release dazu vorhanden - Release inkl. ZIP-Anhang neu anlegen.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            claw-voice-bridge-macos.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Attach ZIP to existing Release
        # Release wurde bereits erstellt (z. B. über die GitHub-UI, was den
        # push-Trigger auf den Tag oft nicht zuverlässig auslöst) - hier nur
        # noch das ZIP an die vorhandene Release anhängen.
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.event.release.tag_name }}" \
            claw-voice-bridge-macos.zip \
            --clobber
