name: Build macOS Binary

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    # Reine Doku-Änderungen (egal wie tief verschachtelt) sollen weder den
    # eingebetteten Test-Job noch den teuren macOS-Runner beschäftigen -
    # `plan` würde ohnehin build=false liefern, aber erst nach dem Checkout.
    paths-ignore:
      - '**/*.md'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Dieselben Prüfungen wie test.yml (dort auch als eigener Pflicht-Check auf
  # jedem Pull Request) - hier als Job eingebunden, damit der macOS-Build
  # unten technisch per `needs:` davon abhängt und nicht nur der Konvention
  # nach erst nach grünen Tests laufen sollte.
  test:
    uses: ./.github/workflows/test.yml

  # Entscheidet auf einem günstigen Ubuntu-Runner, ob überhaupt gebaut werden
  # muss. Ohne diesen Schritt würde jeder Merge nach main einen macOS-Runner
  # beschäftigen (die zehnfach gewichtet abgerechnet werden), obwohl es meist
  # nichts zu veröffentlichen gibt.
  plan:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.plan.outputs.package }}
      binary: ${{ steps.plan.outputs.binary }}
      tag: ${{ steps.plan.outputs.tag }}
      mode: ${{ steps.plan.outputs.mode }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tags werden gebraucht, um zu erkennen, ob die Version aus
          # Cargo.toml bereits veröffentlicht wurde.
          fetch-depth: 0

      - name: Plan release
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          # Quelle der Wahrheit für Name und Version ist Cargo.toml. Alles
          # andere (Tag, Release, Archivname, Binary im Archiv) leitet sich
          # davon ab - hier steht kein Produktname mehr fest verdrahtet.
          cargo_name="$(grep -m1 '^name' Cargo.toml | cut -d'"' -f2)"
          cargo_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"

          case "$EVENT_NAME" in
            release)
              # Release über die GitHub-UI angelegt - nur noch das ZIP anhängen.
              version="${RELEASE_TAG#v}"
              mode="attach"
              ;;
            push)
              if [ "$REF_TYPE" = "tag" ]; then
                # Tag von Hand gepusht.
                version="${REF_NAME#v}"
                mode="create"
              elif git rev-parse -q --verify "refs/tags/v${cargo_version}" >/dev/null; then
                # Version aus Cargo.toml ist bereits veröffentlicht - dieser
                # Push hat die Version also nicht angefasst, nichts zu tun.
                version="$cargo_version"
                mode="skip"
              else
                # Version in Cargo.toml wurde erhöht: Tag und Release werden
                # daraus erzeugt.
                version="$cargo_version"
                mode="create"
              fi
              ;;
            *)
              # workflow_dispatch: nur bauen, nichts veröffentlichen.
              version="$cargo_version"
              mode="none"
              ;;
          esac

          # Tag und Cargo.toml dürfen nicht auseinanderlaufen. Da Tags
          # normalerweise aus Cargo.toml entstehen, ist ein abweichender
          # Tag fast immer ein Versehen - deshalb Abbruch statt stiller
          # Veröffentlichung unter falscher Nummer.
          if [ "$mode" != "skip" ] && [ "$version" != "$cargo_version" ]; then
            echo "::error::Version $version (aus dem Tag) passt nicht zu Cargo.toml ($cargo_version). Entweder Cargo.toml hochziehen oder den Tag korrigieren."
            exit 1
          fi

          if [ "$mode" = "skip" ]; then
            build=false
            echo "Version $version ist bereits als Tag v$version veröffentlicht - kein Build nötig."
          else
            build=true
            echo "Version $version, Modus $mode"
          fi

          {
            echo "package=${cargo_name}-${version}-macos"
            echo "binary=${cargo_name}"
            echo "tag=v${version}"
            echo "mode=$mode"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: [test, plan]
    if: needs.plan.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Package as ZIP
        env:
          STAGE: ${{ needs.plan.outputs.package }}
          BIN: ${{ needs.plan.outputs.binary }}
        run: |
          set -euo pipefail
          mkdir "$STAGE"
          cp "target/release/$BIN" "$STAGE/"
          cp README.md CHANGELOG.md config.example.toml "$STAGE/"
          ditto -c -k --sequesterRsrc --keepParent "$STAGE" "$STAGE.zip"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.plan.outputs.package }}
          path: ${{ needs.plan.outputs.package }}.zip
          retention-days: 14

      - name: Create tag and GitHub Release
        # Deckt beide Fälle ab: Version in Cargo.toml erhöht (Tag wird hier
        # miterzeugt) und von Hand gepushter Tag (existiert dann schon).
        if: needs.plan.outputs.mode == 'create'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          ZIP: ${{ needs.plan.outputs.package }}.zip
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "$ZIP" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

      - name: Attach ZIP to existing Release
        # Release wurde bereits über die GitHub-UI erstellt - hier nur noch
        # das ZIP anhängen.
        if: needs.plan.outputs.mode == 'attach'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          ZIP: ${{ needs.plan.outputs.package }}.zip
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "$ZIP" \
            --clobber
