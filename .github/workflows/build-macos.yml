name: Build macOS Binary

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Determine package name
        id: pkg
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PUSHED_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Versionsquelle je nach Auslöser: bei Tag/Release der Tag selbst
          # (führendes "v" entfällt), bei einem manuellen Lauf ohne Tag die
          # Version aus Cargo.toml.
          case "$EVENT_NAME" in
            release) tag="$RELEASE_TAG" ;;
            push)    tag="$PUSHED_REF" ;;
            *)       tag="" ;;
          esac
          if [ -n "$tag" ]; then
            version="${tag#v}"
          else
            version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          fi
          name="openclaw-voicebridge-${version}-macos"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Paketname: $name.zip"

      - name: Package as ZIP
        env:
          STAGE: ${{ steps.pkg.outputs.name }}
        run: |
          set -euo pipefail
          mkdir "$STAGE"
          cp target/release/claw-voice-bridge "$STAGE/"
          cp README.md config.example.toml "$STAGE/"
          ditto -c -k --sequesterRsrc --keepParent "$STAGE" "$STAGE.zip"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.name }}.zip
          retention-days: 14

      - name: Create GitHub Release
        # Tag gepusht (z. B. per `git push origin <tag>`), aber noch keine
        # Release dazu vorhanden - Release inkl. ZIP-Anhang neu anlegen.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.pkg.outputs.name }}.zip
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "$ZIP" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Attach ZIP to existing Release
        # Release wurde bereits erstellt (z. B. über die GitHub-UI, was den
        # push-Trigger auf den Tag oft nicht zuverlässig auslöst) - hier nur
        # noch das ZIP an die vorhandene Release anhängen.
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ZIP: ${{ steps.pkg.outputs.name }}.zip
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "$ZIP" \
            --clobber
