name: Build macOS Binary

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release

      - name: Package as ZIP
        run: |
          set -euo pipefail
          stage="claw-voice-bridge-macos"
          mkdir "$stage"
          cp target/release/claw-voice-bridge "$stage/"
          cp README.md config.example.toml "$stage/"
          ditto -c -k --sequesterRsrc --keepParent "$stage" claw-voice-bridge-macos.zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: claw-voice-bridge-macos
          path: claw-voice-bridge-macos.zip
          retention-days: 14
