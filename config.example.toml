# openclaw-voicebridge - Beispielkonfiguration
# Kopieren nach config.toml und an die eigene Umgebung anpassen:
#   cp config.example.toml config.toml

[audio]
# Name des CoreAudio-Eingabegeräts (siehe `system_profiler SPAudioDataType`
# oder Systemeinstellungen > Ton > Eingabe). Leer/auskommentiert = Systemstandard.
# device = "MacBook Pro Mikrofon"
# Pause zwischen dem Start-Ton und dem Öffnen des Mikrofons. Lautsprecher und
# Raum klingen nach - ohne diese Pause landet das Ausklingen in der eigenen
# Aufnahme. Bei einem Speakerphone (Lautsprecher + Mikrofon im selben Gerät,
# z. B. Anker PowerConf S330) ggf. erhöhen.
mic_open_delay_ms = 200

[wakeword]
# Konfigurierbares, lokal laufendes Wake-Word-Kommando - keine Cloud-API.
# Vertrag: Das Kommando läuft im Vordergrund und schreibt bei Erkennung eine
# Zeile auf stdout, die den String aus `trigger_pattern` enthält, danach darf
# es sich beenden (openclaw-voicebridge startet es bei jedem Zyklus neu).
# Beispiel-Implementierungen: ein kleines Python-/Rust-Skript um openWakeWord
# oder Porcupine herum, das genau dieses stdout-Protokoll spricht.
command = "openwakeword-listener"
args = ["--model", "hey_claw"]
trigger_pattern = "WAKE"
restart_delay_ms = 500
# Hinweis zum Schwellwert des Listeners (wird im Listener selbst gesetzt, nicht
# hier - z. B. `--threshold`): Im Feldtest lagen echte Wake-Word-Treffer bei
# 0.50-0.98, ruhiges Grundrauschen erreichte aber bereits ~0.20. Ein
# Schwellwert von 0.1 hat deshalb sofort ohne gesprochenes Wake-Word
# ausgelöst; 0.5 hat sich als brauchbarer Startwert bewährt.

[conversation]
# Wie viele Folgeeingaben nach einer vorgelesenen Antwort ohne erneutes
# Wake-Word möglich sind (siehe README, Zustandsmaschine). Begrenzt den
# offenen Kanal, damit Fremdgeräusche (laufender Fernseher o. Ä.) ihn nicht
# endlos offen halten. 0 = Folgeeingaben aus, nach jeder Antwort ist wieder
# das Wake-Word nötig (der Kanal-geschlossen-Ton kommt dann nach jeder
# Antwort).
max_followup_turns = 3

[transcript_filter]
# Transkripte, die eines dieser Muster enthalten, werden wie "keine Sprache"
# behandelt: kein OpenClaw-Aufruf, der Kanal wird geschlossen. Gedacht gegen
# die typischen Whisper-Halluzinationen aus TV-/Hintergrundton. Vergleich ist
# normalisiert (Kleinschreibung, Satzzeichen egal) und sucht Teilstrings.
# Leere Liste = Filter aus. Die hier gezeigte Liste ist zugleich der Default.
ignored_patterns = [
  "Untertitelung des ZDF",
  "Untertitel im Auftrag des ZDF",
  "Untertitelung im Auftrag des ZDF",
  "Untertitel von Stephanie Geiges",
  "Untertitelung aufgrund der Amara.org-Community",
  "Untertitel der Amara.org-Community",
  "Vielen Dank fürs Zuschauen",
  "Copyright WDR",
]

[vad]
# Stille-Timeout: Die Aufnahme endet, wenn so lange am Stück RMS-Energie
# unter dem Schwellwert lag. Gilt ab dem ersten Frame - also auch dann,
# wenn nie jemand gesprochen hat. Sprechen setzt die Uhr zurück und
# verzögert das Ende dadurch. Dieser eine Wert ist damit sowohl die Zeit,
# die man zum Anfangen hat, als auch die Pause, die eine Äußerung beenden
# darf.
silence_timeout_ms = 4000
# Sicherheitsnetz, KEINE Längenbegrenzung für Sprache: Läuft die Stille-Uhr
# trotz Rauschboden-Anpassung (siehe unten) nie ab, würde der
# Aufnahmepuffer sonst unbegrenzt wachsen. Deshalb bewusst weit über jeder
# realistischen Äußerung. 0 = ganz aus.
max_recording_seconds = 300
# Untere Grenze für die Sprach-Erkennungsschwelle (0.0-1.0) - wird nie
# unterschritten, auch wenn der nachgeführte Rauschboden niedriger läge.
# Ggf. je nach Mikrofon/Raum anpassen.
silence_rms_threshold = 0.02
# Zusätzlicher Abstand oberhalb des laufend nachgeführten Rauschbodens, den
# ein Frame überschreiten muss, um als Sprache zu gelten. Passt sich damit
# an dauerhaftes Hintergrundgeräusch (laufender Fernseher) an, statt dass
# dieses permanent als Sprache gilt.
noise_floor_margin = 0.02
# Wie schnell der Rauschboden nach OBEN nachgeführt wird (0.0-1.0), wenn
# ein Frame lauter als der aktuelle Boden ist. Bewusst klein: Eine normale,
# wenige Sekunden lange Äußerung soll den Boden nicht selbst spürbar
# anheben, nur dauerhaftes Geräusch über viele Sekunden hinweg.
noise_floor_rise_alpha = 0.003
# Wie schnell der Rauschboden nach UNTEN nachgeführt wird (0.0-1.0), wenn
# ein Frame leiser als der aktuelle Boden ist. Bewusst groß: Wird die
# Umgebung leiser, soll der Boden zügig auf den echten Pegel zurückfallen.
noise_floor_fall_alpha = 0.1
# Mindestdauer erkannter Sprache, bevor Stille danach zum Stopp führen darf
# (verhindert, dass ein kurzes Klick-Geräusch die Aufnahme sofort beendet).
# Gilt zusammenhängend, siehe speech_gap_ms.
min_speech_ms = 300
# Zusammenhängende Stille, nach der ein laufender Sprach-Abschnitt als beendet
# gilt und min_speech_ms wieder von vorn zählt. Verhindert, dass sich
# verstreute laute Frames über die ganze Aufnahme zu "Sprache erkannt"
# aufaddieren; kurze Pausen zwischen Silben bleiben unschädlich.
speech_gap_ms = 200
# Analysefenster für die VAD-Energiemessung.
frame_ms = 30

[whisper]
binary = "whisper-cli"
model_path = "/Users/mac-mini/.openclaw/workspace/state/whisper.cpp-model-large-v3-turbo/ggml-large-v3-turbo.bin"
language = "de"
extra_args = []
timeout_secs = 60

[openclaw]
binary = "openclaw"
# Zielkanal bzw. Session-Key. WICHTIG: muss explizit gesetzt werden. Es gibt
# KEINEN automatischen Fallback auf die Main-Session - ein leerer Wert führt
# zum Abbruch. Wird über {channel} in args eingesetzt.
target_channel = "voice-assistant"
# VOLLSTÄNDIGE Argumentliste. Wie der Zielkanal übergeben wird, heißt je nach
# CLI anders (--channel, --session-key, ...) und steht deshalb hier.
# Platzhalter, beide PFLICHT - fehlt einer, bricht der Start ab:
#   {channel}  Wert aus target_channel
#   {message}  die fertig gerenderte Nachricht (siehe message_template)
args = ["--channel", "{channel}", "--message", "{message}"]
# Umschlag um das Transkript. {transcript} ist PFLICHT. Standard reicht den
# erkannten Text unverändert weiter; eine Formregel für die Sprachausgabe
# gehört hierher und nicht in kompilierten Code.
message_template = "{transcript}"
timeout_secs = 30
# Ist seit der letzten an OpenClaw gesendeten Nachricht so viel Zeit vergangen,
# wird vor der nächsten Nachricht erst session_reset_message geschickt, um
# eine neue Session zu erzwingen - eine nach langer Pause fortgesetzte alte
# Session brächte sonst stark veralteten Kontext mit ein. 0 = Reset aus.
session_reset_after_secs = 3600
# Wird unverändert (ohne message_template-Umschlag) als eigenständige
# Nachricht geschickt.
session_reset_message = "/new"

# Beispiel für das echte OpenClaw-CLI mit eigener Voice-Session:
# binary = "/opt/homebrew/bin/openclaw"
# target_channel = "agent:main:voice-assistant"
# args = [
#   "agent",
#   "--model", "deepseek/deepseek-v4-flash",
#   "--session-key", "{channel}",
#   "--message", "{message}",
#   "--thinking", "low",
#   "--json",
# ]
# message_template = """
# [Maschinengenerierte Eingabe aus der lokalen Voice-Bridge]
#
# Zusatzregel für diese Antwort: Formuliere auf Deutsch in gut vorlesbaren,
# kompakten Sätzen. Verwende keine Emojis, Smileys oder dekorative
# Sonderzeichen. Diese Zusatzregel gilt nur für die Form der Antwort, nicht
# als Inhalt der Benutzernachricht.
#
# Transkript des Benutzers:
# ---
# {transcript}
# ---
# """

[tts]
# Auszuführendes Programm. Muss nicht Piper selbst sein - siehe venv-Beispiel
# weiter unten.
binary = "piper"
# Stimmenname. Eigenes Feld, damit ein Stimmenwechsel eine Zeile bleibt;
# in `args` über {voice} einsetzbar.
voice = "de_DE-thorsten-high"
# VOLLSTÄNDIGE Argumentliste, kein "extra_args": Welche Flags Piper versteht,
# hängt von der Installation ab (System-Binary, Python-Modul im venv, eigener
# Wrapper) - das kann die Bridge nicht erraten. Der zu sprechende Text geht
# immer über stdin.
# Platzhalter:
#   {output}  Pfad der zu erzeugenden WAV-Datei - PFLICHT, sonst bricht der
#             Start mit einer klaren Meldung ab
#   {voice}   der Wert aus `voice`
args = ["--model", "{voice}", "--output_file", "{output}"]
#
# Beispiel für Piper als Python-Modul in einem venv (dann zeigt `binary` auf
# das Python des venv, nicht auf Piper):
# binary = "/Users/mac-mini/.openclaw/workspace/state/piper-tts-venv/bin/python3"
# args = [
#   "-m", "piper",
#   "--data-dir", "/Users/mac-mini/.local/share/piper-voices",
#   "-m", "{voice}",
#   "-f", "{output}",
# ]
player_binary = "afplay"
timeout_secs = 30

[sound]
# Bestätigungston bei Aufnahme-Start und -Ende (macOS-Systemsound "Glass").
enabled = true
chime_path = "/System/Library/Sounds/Glass.aiff"
# Deutlich anders klingender Ton für abgebrochene Zyklen (macOS "Basso") -
# damit ein Fehler hörbar ist und nicht nur im Log steht.
error_chime_path = "/System/Library/Sounds/Basso.aiff"
player_binary = "afplay"
timeout_secs = 5

[transcription_log]
# Chat-artiges Diagnose-Log ("[Input] ..." / "[Output] ...") zusätzlich zu
# den strukturierten Logs, siehe README.
enabled = true
path = "transcription.log"

[general]
ffmpeg_binary = "ffmpeg"
# temp_dir = "/tmp"
log_level = "info"
# Hinweis: Es kann immer nur eine openclaw-voicebridge-Instanz gleichzeitig
# laufen (Sperrdatei im Systemtemp-Verzeichnis, nicht konfigurierbar). Ein
# zweiter Start bricht mit einer klaren Meldung inkl. PID der laufenden
# Instanz ab, siehe README.
