# claw-voice-bridge - Beispielkonfiguration
# Kopieren nach config.toml und an die eigene Umgebung anpassen:
#   cp config.example.toml config.toml

[audio]
# Name des CoreAudio-Eingabegeräts (siehe `system_profiler SPAudioDataType`
# oder Systemeinstellungen > Ton > Eingabe). Leer/auskommentiert = Systemstandard.
# device = "MacBook Pro Mikrofon"

[wakeword]
# Konfigurierbares, lokal laufendes Wake-Word-Kommando - keine Cloud-API.
# Vertrag: Das Kommando läuft im Vordergrund und schreibt bei Erkennung eine
# Zeile auf stdout, die den String aus `trigger_pattern` enthält, danach darf
# es sich beenden (claw-voice-bridge startet es bei jedem Zyklus neu).
# Beispiel-Implementierungen: ein kleines Python-/Rust-Skript um openWakeWord
# oder Porcupine herum, das genau dieses stdout-Protokoll spricht.
command = "openwakeword-listener"
args = ["--model", "hey_claw"]
trigger_pattern = "WAKE"
restart_delay_ms = 500
# Hinweis zum Schwellwert des Listeners (wird im Listener selbst gesetzt, nicht
# hier - z. B. `--threshold`): Im Feldtest lagen echte Wake-Word-Treffer bei
# 0.50-0.98, ruhiges Grundrauschen erreichte aber bereits ~0.20. Ein
# Schwellwert von 0.1 hat deshalb sofort ohne gesprochenes Wake-Word
# ausgelöst; 0.5 hat sich als brauchbarer Startwert bewährt.

[conversation]
# Wie viele Folgeeingaben nach einer vorgelesenen Antwort ohne erneutes
# Wake-Word möglich sind (siehe README, Zustandsmaschine). Begrenzt den
# offenen Kanal, damit Fremdgeräusche (laufender Fernseher o. Ä.) ihn nicht
# endlos offen halten. 0 = Folgeeingaben aus, nach jeder Antwort ist wieder
# das Wake-Word nötig (der Kanal-geschlossen-Ton kommt dann nach jeder
# Antwort).
max_followup_turns = 3

[transcript_filter]
# Transkripte, die eines dieser Muster enthalten, werden wie "keine Sprache"
# behandelt: kein OpenClaw-Aufruf, der Kanal wird geschlossen. Gedacht gegen
# die typischen Whisper-Halluzinationen aus TV-/Hintergrundton. Vergleich ist
# normalisiert (Kleinschreibung, Satzzeichen egal) und sucht Teilstrings.
# Leere Liste = Filter aus. Die hier gezeigte Liste ist zugleich der Default.
ignored_patterns = [
  "Untertitelung des ZDF",
  "Untertitel im Auftrag des ZDF",
  "Untertitelung im Auftrag des ZDF",
  "Untertitel von Stephanie Geiges",
  "Untertitelung aufgrund der Amara.org-Community",
  "Untertitel der Amara.org-Community",
  "Vielen Dank fürs Zuschauen",
  "Copyright WDR",
]

[vad]
# Stille-Timeout: Aufnahme endet, nachdem nach erkannter Sprache diese
# Zeit lang RMS-Energie unter dem Schwellwert lag.
silence_timeout_ms = 4000
# Harte Obergrenze für eine einzelne Aufnahme.
max_recording_seconds = 60
# RMS-Schwellwert (0.0-1.0) für "Sprache erkannt". Ggf. je nach Mikrofon/
# Raum anpassen.
silence_rms_threshold = 0.02
# Mindestdauer erkannter Sprache, bevor Stille danach zum Stopp führen darf
# (verhindert, dass ein kurzes Klick-Geräusch die Aufnahme sofort beendet).
min_speech_ms = 300
# Analysefenster für die VAD-Energiemessung.
frame_ms = 30

[whisper]
binary = "whisper-cli"
model_path = "/Users/mac-mini/.openclaw/workspace/state/whisper.cpp-model-large-v3-turbo/ggml-large-v3-turbo.bin"
language = "de"
extra_args = []
timeout_secs = 60

[openclaw]
binary = "openclaw"
# WICHTIG: muss explizit gesetzt werden. Es gibt KEINEN automatischen
# Fallback auf die Main-Session - ein leerer Wert führt zum Abbruch.
target_channel = "voice-assistant"
extra_args = []
timeout_secs = 30

[tts]
piper_binary = "piper"
voice = "de_DE-thorsten-high"
# Alternativ direkter Modellpfad statt Stimmenname:
# model_path = "/Users/mac-mini/.local/share/piper/de_DE-thorsten-high.onnx"
extra_args = []
player_binary = "afplay"
timeout_secs = 30

[sound]
# Bestätigungston bei Aufnahme-Start und -Ende (macOS-Systemsound "Glass").
enabled = true
chime_path = "/System/Library/Sounds/Glass.aiff"
# Deutlich anders klingender Ton für abgebrochene Zyklen (macOS "Basso") -
# damit ein Fehler hörbar ist und nicht nur im Log steht.
error_chime_path = "/System/Library/Sounds/Basso.aiff"
player_binary = "afplay"
timeout_secs = 5

[transcription_log]
# Chat-artiges Diagnose-Log ("[Input] ..." / "[Output] ...") zusätzlich zu
# den strukturierten Logs, siehe README.
enabled = true
path = "transcription.log"

[general]
ffmpeg_binary = "ffmpeg"
# temp_dir = "/tmp"
log_level = "info"
# Verhindert, dass versehentlich zwei claw-voice-bridge-Prozesse gleichzeitig
# laufen: jeder würde einen eigenen Wake-Word-Listener starten und parallel auf
# dasselbe Mikrofon zugreifen. Der zweite Start bricht dann mit einer klaren
# Meldung inkl. PID der laufenden Instanz ab.
single_instance = true
# Sperrdatei dafür. Standard: <temp_dir>/claw-voice-bridge.lock bzw. im
# Systemtemp-Verzeichnis.
# lock_file = "/tmp/claw-voice-bridge.lock"
