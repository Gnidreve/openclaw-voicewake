[package]
name = "openclaw-voicebridge"
version = "0.1.9"
edition = "2021"
description = "Lokaler macOS-Sprachdienst: Wake-Word -> VAD -> Whisper -> OpenClaw -> Piper TTS"

[[bin]]
name = "openclaw-voicebridge"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
cpal = "0.15"
# Lock-freier SPSC-Ringpuffer zwischen dem Echtzeit-Audio-Callback und der
# Aufnahmeschleife (siehe src/audio.rs) - der Callback allokiert dadurch
# nichts mehr auf dem Heap.
ringbuf = "0.5.1"
hound = "3.5"
uuid = { version = "1", features = ["v4"] }
# Für das Auslesen der Antwort aus der JSON-Ausgabe des OpenClaw-CLI.
serde_json = "1"

# Nur für die flock-basierte Einzelinstanz-Sperre (siehe src/instance_lock.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 2
