[package]
name = "claw-voice-bridge"
version = "0.1.0"
edition = "2021"
description = "Lokaler macOS-Sprachdienst: Wake-Word -> VAD -> Whisper -> OpenClaw -> Piper TTS"

[[bin]]
name = "claw-voice-bridge"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
cpal = "0.15"
hound = "3.5"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 2
