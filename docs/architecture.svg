<svg viewBox="220 20 760 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="voicebridge-ring-title voicebridge-ring-desc">
  <title id="voicebridge-ring-title">OpenClaw VoiceBridge – Sprachkreislauf</title>
  <desc id="voicebridge-ring-desc">Kreisfoermiger Ablauf von Wake Word ueber Mikrofon, VAD, Transkription, OpenClaw, Sprachausgabe und Lautsprecher zurueck zu Wake Word, mit einem duennen gestrichelten Kurzschluss von Lautsprecher zu Mikrofon fuer Folgerunden, die denselben Session-Key wiederverwenden.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8399"/></marker>
  </defs>

  <rect x="220" y="20" width="760" height="680" fill="#f5f5f5"/>

  <!-- ================= Ring flow (clockwise, solid circular arcs) ================= -->
  <path d="M 675.0,142.6 A 230 230 0 0 1 750.2,185.8" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 800.1,246.6 A 230 230 0 0 1 829.1,380.0" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 815.2,441.2 A 230 230 0 0 1 747.5,536.5" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 624.8,588.7 A 230 230 0 0 1 576.4,588.8" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 453.4,537.2 A 230 230 0 0 1 385.2,442.3" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 371.0,381.2 A 230 230 0 0 1 399.3,247.6" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 448.9,186.6 A 230 230 0 0 1 523.9,143.0" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Arrow label: Antworttext (OpenClaw -> Sprachausgabe) -->
  <rect x="365" y="493" width="112" height="14" rx="2" fill="#f5f5f5"/>
  <text x="421" y="503" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ANTWORTTEXT</text>

  <!-- ================= Folgerunde-Kurzschluss: Lautsprecher -> Mikrofon ================= -->
  <!-- Duenner Faden statt Hub: gleicher session_key/target_channel wird bei Folgerunden weitergereicht -->
  <line x1="495.2" y1="216.6" x2="704.8" y2="216.6" stroke="#7a8399" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
  <rect x="500" y="195" width="200" height="14" rx="2" fill="#f5f5f5"/>
  <text x="600" y="205" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FOLGERUNDE · GLEICHER SESSION-KEY</text>

  <!-- ================= Stationen ================= -->

  <!-- Wake Word -->
  <rect x="525.0" y="100.0" width="150" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="600.0" y="126.0" fill="#2d3142" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Wake Word</text>
  <text x="600.0" y="144.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Trigger-Erkennung</text>

  <!-- Mikrofon -->
  <rect x="704.8" y="186.6" width="150" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="779.8" y="212.6" fill="#2d3142" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mikrofon</text>
  <text x="779.8" y="230.6" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Audio-Capture</text>

  <!-- VAD -->
  <rect x="749.2" y="381.2" width="150" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="824.2" y="407.2" fill="#2d3142" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">VAD</text>
  <text x="824.2" y="425.2" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Stille-Erkennung</text>

  <!-- Transkription (focal / austauschbar) -->
  <rect x="624.8" y="537.2" width="150" height="60" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="699.8" y="563.2" fill="#2d3142" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Transkription</text>
  <text x="699.8" y="581.2" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Speech-to-Text</text>

  <!-- OpenClaw -->
  <rect x="425.2" y="537.2" width="150" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
  <text x="500.2" y="563.2" fill="#2d3142" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OpenClaw</text>
  <text x="500.2" y="581.2" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Kernlogik</text>

  <!-- Sprachausgabe (focal / austauschbar) -->
  <rect x="300.8" y="381.2" width="150" height="60" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
  <text x="375.8" y="407.2" fill="#2d3142" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sprachausgabe</text>
  <text x="375.8" y="425.2" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Text-to-Speech</text>

  <!-- Lautsprecher -->
  <rect x="345.2" y="186.6" width="150" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="420.2" y="212.6" fill="#2d3142" font-size="12.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lautsprecher</text>
  <text x="420.2" y="230.6" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Audio-Output</text>

  <!-- ================= Annotation-Callouts (max 2) ================= -->

  <!-- Callout 1: Transkription -->
  <text x="910" y="640" fill="#eb6c36" font-size="13" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">austauschbar:</text>
  <text x="910" y="658" fill="#eb6c36" font-size="12" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">whisper-cli / talk.session.*</text>
  <path d="M 880 632 Q 810 610 748 598" fill="none" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="740" cy="595" r="2" fill="#eb6c36"/>

  <!-- Callout 2: Sprachausgabe -->
  <text x="290" y="640" fill="#eb6c36" font-size="13" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">austauschbar:</text>
  <text x="290" y="658" fill="#eb6c36" font-size="12" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">Piper / tts.speak</text>
  <path d="M 320 632 Q 340 500 302 425" fill="none" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="300" cy="415" r="2" fill="#eb6c36"/>

  <!-- ================= Fussnote ================= -->
  <line x1="260" y1="672" x2="940" y2="672" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="260" y="688" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">audio_pipeline schaltet Transkription + Sprachausgabe gemeinsam um · "gateway" setzt transport = "websocket" voraus</text>
</svg>
